services:
  - type: web
    name: piaseg-chamados-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    filter:
      paths:
        - backend/**
    disk:
      name: piaseg-chamados-data
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false
